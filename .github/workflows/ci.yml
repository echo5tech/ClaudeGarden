name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` can inline them; pages fall back to demo
      # data when Supabase is unreachable, so validity is not required.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version read from packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # expo-router typed routes live in untracked .expo/types — generate them
      # so the mobile typecheck runs against strict route types.
      - name: Generate Expo typed routes
        run: npx expo customize tsconfig.json
        working-directory: apps/mobile

      - run: pnpm lint

      - run: pnpm check-types

      - run: pnpm test

      - run: pnpm build

  db-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots local Postgres and applies every migration — doubles as a
      # "migrations apply cleanly from scratch" gate.
      - run: supabase db start

      - run: supabase db lint

      # pgTAP suite in supabase/tests — pins the RLS visibility matrix
      # (garden visibility, blocks, zip grant, own-row tasks, takedowns).
      - run: supabase test db

  edge-functions:
    runs-on: ubuntu-latest
    # Advisory for now — flip to blocking once it has run green on main.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Type-check every Edge Function against its own import map. The
      # @supabase/server import ships with the Edge runtime, so functions
      # without a local mapping for it are checked best-effort.
      - name: deno check edge functions
        working-directory: supabase/functions
        run: |
          set -e
          for dir in */; do
            fn="${dir%/}"
            if [ -f "$fn/index.ts" ]; then
              echo "── checking $fn"
              if [ -f "$fn/deno.json" ]; then
                deno check --config "$fn/deno.json" "$fn/index.ts" || exit 1
              else
                deno check --no-lock "$fn/index.ts" || exit 1
              fi
            fi
          done
